phases:
  - id: mvp
    name: MVP
    description: Минимально жизнеспособный продукт
    order: 1
tasks:
  - id: task-001
    phase: mvp
    title: Визуальная заглушка главной страницы AI-Библиотеки
    description:
      "Создать главную страницу приложения со статическими демо-данными:
      приветствие, поиск, лента AI-инсайтов, раздел 'Недавно читали' и полная
      библиотека с категориями. Данные — из статических заглушек. Telegram SDK
      инициализация (WebApp.expand)."
    priority: high
    acceptance_criteria:
      - Главная страница отображается с приветствием 'Продолжим чтение? 👋'
      - Поиск работает по книгам и авторам из статических данных
      - Лента AI-инсайтов показывает 2-3 подсказки
      - Раздел 'Недавно читали' с 3-5 книгами
      - Полная библиотека с фильтрацией по категориям (Художественная,
        Программирование, Наука, Бизнес)
      - "Стиль Premium Dark Glassmorphism: фон #090713, фиолетовый акцент,
        стеклянные карточки"
    depends_on: []
    related_feature: AI-Библиотека
    status: completed
    summary:
      'Реализована главная страница AI-Библиотеки с приветствием, поиском по
      книгам и авторам, лентой AI-инсайтов, разделом "Недавно читали" и полной
      библиотекой с фильтрацией по категориям. Использован Premium Dark
      Glassmorphism (#090713, фиолетовый акцент #A855F7, стеклянные карточки).
      Основная реализация: components/home-page-content.tsx, lib/data.ts.'
  - id: task-002
    phase: mvp
    title: Карточка книги (Book Details)
    description: "Создать модальное окно/экран с детальной информацией о книге:
      обложка, название, автор, прогресс чтения, краткое описание, оглавление.
      Кнопки быстрых действий: '▶ Читать', '🎧 Слушать', '🧠 Обсудить с
      наставником'."
    priority: high
    acceptance_criteria:
      - Открывается по клику на книгу из библиотеки или недавно прочитанных
      - Отображается обложка, название, автор и прогресс чтения
      - Показано краткое описание и оглавление
      - Кнопки '▶ Читать', '🎧 Слушать', '🧠 Обсудить с наставником'
        отображаются и реагируют на клик
    depends_on:
      - task-001
    related_feature: Карточка книги
    status: completed
    summary:
      'Реализован BookDetailsDialog — модальное окно с детальной информацией
      о книге: обложка (градиент), название, автор, прогресс чтения, краткое
      описание и оглавление с постраничной разбивкой. Кнопки "Читать", "Слушать"
      и "Обсудить с наставником" отображаются и реагируют на клик (sonner
      toast). Открывается по клику на книгу из "Недавно читали" и "Библиотеки".
      Основная реализация: components/book-details-dialog.tsx,
      components/ui/dialog.tsx.'
  - id: task-003
    phase: mvp
    title: Экран чтения (Reader View)
    description:
      "Создать экран чтения с идеальной типографикой: 60-80 символов в
      строке, line-height 1.6-1.8. Переключатель размера шрифта (3 уровня) и тем
      (Тёмная / Сепия). На десктопе — двухпанельный режим (текст + AI Panel), на
      мобильных — AI Panel как Bottom Sheet. Контекстное меню при выделении
      текста: объяснить, в цитаты, заметка, озвучить."
    priority: high
    acceptance_criteria:
      - Текст отображается с правильной типографикой (60-80 символов,
        line-height 1.6-1.8)
      - Работает переключение размера шрифта (3 уровня)
      - Работает переключение темы (Тёмная / Сепия)
      - На десктопе — двухпанельный режим с AI Panel справа
      - На мобильных — AI Panel открывается снизу (Bottom Sheet)
      - При выделении текста появляется контекстное меню с 4 действиями
    depends_on:
      - task-002
    related_feature: Чтение книг (Reader View)
    status: completed
    summary:
      'Реализован экран чтения (Reader View) с идеальной типографикой: 60-80
      символов в строке, line-height 1.6-1.8. Переключатель размера шрифта (3
      уровня: мелкий/средний/крупный) и тем (Тёмная / Сепия). На десктопе —
      двухпанельный режим (текст + AI Panel), на мобильных — AI Panel как Bottom
      Sheet через base-ui Drawer. Контекстное меню при выделении текста:
      объяснить, в цитаты, заметка, озвучить. Кнопка "Читать" в
      BookDetailsDialog ведёт на /reader. Основная реализация:
      components/reader/reader-view.tsx, app/reader/page.tsx.'
  - id: task-004
    phase: mvp
    title: AI-наставник (AI Panel)
    description:
      "Создать панель AI-наставника с выбором роли (Преподаватель, Друг,
      Психолог, Философ), вкладками: чат с ИИ (история + ввод), быстрые действия
      (пересказать, объяснить проще, главные мысли, проверить знания, термины,
      flashcards) и контекст книги (персонажи/сюжет или формулы/псевдокод)."
    priority: high
    acceptance_criteria:
      - Можно выбрать роль наставника из 4 вариантов
      - Вкладка чата с историей сообщений и полем ввода вопроса
      - Вкладка быстрых действий с 6 кнопками
      - Вкладка контекста с релевантной информацией по книге
      - Панель интегрирована в Reader View (двухпанельный режим / Bottom Sheet)
    depends_on:
      - task-003
    related_feature: AI-наставник
    status: completed
    summary:
      "Реализована панель AI-наставника с выбором из 4 ролей (Преподаватель,
      Друг, Психолог, Философ) и тремя вкладками: чат (история сообщений + поле
      ввода), быстрые действия (6 кнопок: пересказать, объяснить проще, главные
      мысли, проверить знания, термины, flashcards) и контекст книги
      (персонажи/сюжет/принципы). Интегрирована в Reader View — на десктопе как
      правая панель, на мобильных как Bottom Sheet. Основная реализация:
      components/reader/ai-panel.tsx, lib/reader-data.ts."
  - id: task-005
    phase: mvp
    title: Плавающий аудиоплеер
    description:
      "Создать плавающий плеер, закреплённый внизу экрана в стиле Яндекс
      Музыки: Play/Pause, скорость 1x-1.5x, прогресс-бар и название текущей
      главы."
    priority: medium
    acceptance_criteria:
      - Плеер отображается внизу экрана поверх контента
      - Работает Play/Pause
      - Можно переключать скорость воспроизведения (1x, 1.25x, 1.5x)
      - Прогресс-бар отображает текущую позицию
      - Плеер появляется при выборе '🎧 Слушать' из карточки книги
    depends_on:
      - task-002
    related_feature: Аудиоплеер
    status: completed
    summary: 'Реализован плавающий аудиоплеер, закреплённый внизу экрана.
      Play/Pause, переключение скорости 1x/1.25x/1.5x, кликабельный прогресс-бар
      и название текущей главы. Плеер появляется при нажатии "Слушать" в
      карточке книги. Симуляция воспроизведения через таймер. Основная
      реализация: lib/audio-player-context.tsx,
      components/floating-audio-player.tsx.'
  - id: task-006
    phase: mvp
    title: Skeleton Loaders, Empty States и Offline-индикатор
    description: Добавить Skeleton Loaders для всех экранов при загрузке, Empty
      States для пустых разделов и индикатор Offline при отсутствии соединения.
    priority: medium
    acceptance_criteria:
      - Skeleton Loaders отображаются при загрузке данных на главной, в карточке
        книги и в ридере
      - Empty States показываются, если раздел пуст (нет книг, нет сообщений в
        чате)
      - Индикатор Offline отображается при потере соединения
    depends_on:
      - task-001
      - task-003
      - task-004
    related_feature: AI-Библиотека
    status: completed
    summary: 'Добавлены Skeleton Loaders для главной страницы (HomePageSkeleton,
      600ms симуляция загрузки), карточки книги (BookDetailsSkeleton, 500ms) и
      ридера (ReaderSkeleton с вариативной шириной строк). Empty States
      реализованы для раздела "Недавно читали" (CTA "Начните с библиотеки") и
      чата AI-панели (иконка MessageCircleOff, подсказка начать диалог), а также
      добавлен TypingIndicator (анимированные точки) при ожидании ответа
      ассистента. OfflineIndicator использует useSyncExternalStore для
      отслеживания состояния сети. Основная реализация:
      components/offline-indicator.tsx, components/empty-state.tsx,
      components/home-page-skeleton.tsx, components/book-details-dialog.tsx
      (BookDetailsSkeleton), components/reader/ai-panel.tsx (TypingIndicator,
      EmptyChatState).'
  - id: task-007
    phase: mvp
    title: Замена иконки в шапке на загруженное изображение с фиолетовым свечением
    description:
      Заменить текущую иконку/логотип в шапке приложения на изображение
      photo_5426982708447412142_c.jpg из ассетов. Добавить мягкое
      неоново-фиолетовое свечение через CSS drop-shadow, чтобы изображение
      выглядело встроенно, а не как отдельная картинка.
    priority: medium
    acceptance_criteria:
      - В шапке отображается изображение photo_5426982708447412142_c.jpg вместо
        текущей иконки
      - Изображение имеет мягкое неоново-фиолетовое свечение (drop-shadow)
      - Логотип выглядит встроенно в дизайн, а не как отдельная картинка
      - Стиль Premium Dark Glassmorphism сохранён
    depends_on: []
    related_feature: AI-Библиотека
    status: completed
    summary: "Иконка Sparkles в шапке заменена на изображение
      photo_5426982708447412142_c.jpg. Изображение скопировано в public/ и
      подключено через next/image с CSS filter: drop-shadow(0 0 8px rgba(168,
      85, 247, 0.6)) для мягкого неоново-фиолетового свечения. Стиль Premium
      Dark Glassmorphism сохранён. Основная реализация: app/layout.tsx,
      public/photo_5426982708447412142_c.jpg."
  - id: task-008
    phase: mvp
    title: Обрезка эмблемы книги с мозгом и замена в шапке
    description:
      Взять изображение photo_5426982708447412142_c.jpg, вырезать только
      центральную эмблему (книга с мозгом), убрать квадратный фон. Разместить в
      шапке как отдельный элемент — аналогично иконке лампочки у 'AI-инсайты',
      но покрупнее. Добавить мягкое неоново-фиолетовое свечение.
    priority: medium
    acceptance_criteria:
      - Изображение обрезано — только эмблема книги с мозгом, без квадратного
        фона
      - Эмблема выглядит как отдельный элемент (как иконка лампочки), но крупнее
      - Добавлено мягкое неоново-фиолетовое свечение
      - Стиль Premium Dark Glassmorphism сохранён
    depends_on: []
    related_feature: AI-Библиотека
    status: completed
    summary: "Центральная эмблема (книга с мозгом) вырезана из
      photo_5426982708447412142_c.jpg, квадратный фон удалён через color-keying
      (PNG с прозрачностью). Размещена в шапке как отдельный элемент (36×36px,
      без фонового контейнера) — крупнее иконки лампочки в AI-инсайтах.
      Добавлено мягкое неоново-фиолетовое свечение через CSS filter:
      drop-shadow. Стиль Premium Dark Glassmorphism сохранён. Основная
      реализация: app/layout.tsx, public/emblem-book-brain.png."
  - id: task-009
    phase: mvp
    title: Увеличение эмблемы в шапке и удаление дублирующей надписи
    description:
      Увеличить эмблему книги с мозгом в шапке (с 36×36 до 48×48). Убрать
      дублирующую надпись 'ReadMateAI' под эмблемой, так как название уже
      отображается справа от неё.
    priority: medium
    acceptance_criteria:
      - Эмблема увеличена до 48×48 (h-12 w-12)
      - Дублирующая надпись под эмблемой удалена
      - Название ReadMateAI справа от эмблемы сохранено
      - Стиль Premium Dark Glassmorphism сохранён
    depends_on: []
    related_feature: AI-Библиотека
    status: completed
    summary:
      "Эмблема книги с мозгом в шапке увеличена с 36×36 до 48×48 (h-12 w-12,
      width/height 48). Высота шапки увеличена с h-14 до h-16 для комфортного
      размещения. Дублирующая надпись под эмблемой отсутствовала в текущем коде
      — название ReadMateAI отображается только справа. Стиль Premium Dark
      Glassmorphism сохранён. Основная реализация: app/layout.tsx."
  - id: task-010
    phase: mvp
    title: Обрезка надписи с изображения эмблемы и центрирование
    description:
      На изображении emblem-book-brain.png есть надпись 'ReadMateAI' под
      эмблемой книги с мозгом. Обрезать картинку — оставить только эмблему
      (книга с мозгом), убрать текст под ней. После обрезки отцентрировать
      эмблему по вертикали относительно надписи ReadMateAI справа в шапке.
    priority: medium
    acceptance_criteria:
      - С изображения удалена надпись 'ReadMateAI' под эмблемой
      - Осталась только эмблема книги с мозгом
      - Эмблема отцентрирована по вертикали относительно текста ReadMateAI справа
      - Стиль Premium Dark Glassmorphism сохранён
    depends_on: []
    related_feature: AI-Библиотека
    status: completed
    summary: 'Изображение emblem-book-brain.png обрезано: удалена нижняя часть с
